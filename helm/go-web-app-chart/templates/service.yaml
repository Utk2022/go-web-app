apiVersion: v1
kind: Service
metadata:
  name: go-web-app
  labels:
    app: go-web-app
    app.kubernetes.io/name: go-web-app
spec:
  type: {{ .Values.service.type }}

  selector:
    app: go-web-app

  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
