apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "go-web-app.fullname" . }}
  labels:
    {{- include "go-web-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%        # Spin up a quarter of new pods before killing old ones
      maxUnavailable: 0%   # Guarantees zero traffic loss during updates
  selector:
    matchLabels:
      {{- include "go-web-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "go-web-app.selectorLabels" . | nindent 8 }}
    spec:
      # Pod Anti-Affinity guarantees pods are distributed across different physical EC2 nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                  - {{ include "go-web-app.name" . }}
              topologyKey: "kubernetes.io/hostname"
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # Liveness and Readiness Probes prevent dead or uninitialized code from serving traffic
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          # Strict resource limits block noisy-neighbor problems and resource starvation
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"
