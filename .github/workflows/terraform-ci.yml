name: Terraform CI

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-ci.yml"

  push:
    branches:
      - master
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-ci.yml"

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VERSION: "1.16.4"

jobs:
  terraform:
    name: Terraform validation - ${{ matrix.directory }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false

      matrix:
        directory:
          - terraform/bootstrap
          - terraform/eks

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7.0.1


      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false


      - name: Terraform version
        working-directory: ${{ matrix.directory }}
        run: |
          set -euo pipefail
          terraform version


      - name: Terraform format check
        run: |
          set -euo pipefail
          terraform fmt -check -recursive


      - name: Terraform init
        working-directory: ${{ matrix.directory }}
        run: |
          set -euo pipefail
          terraform init -backend=false


      - name: Terraform validate
        working-directory: ${{ matrix.directory }}
        run: |
          set -euo pipefail
          terraform validate


      - name: Trivy IaC scan - report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ matrix.directory }}
          format: json
          output: trivy-terraform.json
          exit-code: "0"


      - name: Upload Terraform security report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: trivy-terraform-${{ matrix.directory }}
          path: trivy-terraform.json
          retention-days: 14


      - name: Trivy IaC security gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ matrix.directory }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
